[project]
name = "recsys-ecommerce"
version = "0.1.0"
description = "E-commerce recommender system: classical baselines, two-tower retrieval, serving and monitoring"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pyarrow>=18.0",
  "orjson>=3.10",
  "tqdm>=4.66",
  "huggingface-hub>=0.30",
  "torch>=2.6",
  "faiss-cpu>=1.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "redis>=5.2",
  "pydantic-settings>=2.7",
  "prometheus-client>=0.21",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.9",
  "mypy>=1.14",
  "jupyterlab>=4.3",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "playwright>=1.65.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]

[tool.mypy]
python_version = "3.12"
files = ["src/recsys"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
