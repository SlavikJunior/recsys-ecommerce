name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-local
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, recsys]
    environment: local
    env:
      # Артефакты модели — отдельное хранилище, а не содержимое git-чекаута:
      # на раннере деплоится код, а артефакты берутся из постоянного каталога.
      RECSYS_DATA_DIR: /Users/vyacheslav/Documents/se/recsys-ecommerce/data
      RECSYS_ARTIFACTS_DIR: /Users/vyacheslav/Documents/se/recsys-ecommerce/artifacts
    steps:
      - uses: actions/checkout@v5

      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Деплой
        run: ./deploy/deploy.sh

      - name: Проверка после деплоя
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS "http://127.0.0.1:8000/metrics" | grep -c recsys_requests_total
