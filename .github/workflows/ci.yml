name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Установить зависимости
        run: uv sync --frozen --no-install-project --group dev

      - name: Линтер
        run: uv run ruff check .

      - name: Форматирование
        run: uv run ruff format --check .

      - name: Типы
        run: uv run mypy

      - name: Тесты
        run: uv run pytest --cov=recsys --cov-report=term-missing

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 14

  integration:
    needs: build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Дымовой тест сервиса без артефактов
        env:
          RECSYS_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run pytest tests/test_api.py -q
