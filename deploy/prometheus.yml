global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: recsys-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          env: local
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
