groups:
  - name: recsys
    rules:
      - alert: RecsysHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(recsys_request_latency_seconds_bucket{endpoint="recommend"}[1m]))) > 0.15
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 латентности рекомендаций выше 150 мс"
          description: "Значение {{ $value | printf \"%.3f\" }} с. Проверить кэш, ANN-индекс и нагрузку."

      - alert: RecsysErrorRate
        expr: |
          sum(rate(recsys_requests_total{status="error"}[1m]))
          /
          clamp_min(sum(rate(recsys_requests_total[1m])), 1e-9) > 0.01
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Доля ошибок API выше 1%"

      - alert: RecsysPopularityDrift
        expr: recsys_popularity_psi > 0.25
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PSI показов выше 0.25 — дрейф интересов"
          description: "Похоже на смену спроса или сбой ранжирования. Нужен пересчёт и разбор топ-N."

      - alert: RecsysLowCoverage
        expr: recsys_catalog_coverage < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Покрытие каталога ниже 50%"

      - alert: RecsysHighFallbackRate
        expr: |
          sum(rate(recsys_fallback_total[1m]))
          /
          clamp_min(sum(rate(recsys_requests_total{endpoint="recommend"}[1m])), 1e-9) > 0.3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Более 30% запросов обслуживаются популярностью"
          description: "Признак холодного старта или деградации персональных эмбеддингов."
